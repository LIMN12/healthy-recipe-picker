<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>减脂随机菜谱</title>
<!--
  【修复说明】
  原来这里有一行 <link> 标签从 Google Fonts 加载外部 CSS：
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  问题：页面通过 file:// 协议打开时，浏览器将每个 file: URL 视为独立安全源（unique security origin），
        跨协议加载 https:// 的外部资源会触发 "Unsafe attempt to load URL ... 'file:' URLs are treated as unique security origins" 安全报错。
  修复：移除外部字体 <link> 依赖，改用系统字体栈（system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif），
        页面完全自包含，不再触发跨域安全策略。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: #f4f7f4;
    color: #2c3e2d;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: #ffffff;
    max-width: 560px;
    width: 100%;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 8px 30px rgba(46, 84, 46, 0.08);
    border: 1px solid #e6ede6;
    position: relative;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .tag {
    font-size: 12px;
    padding: 3px 10px;
    background: #e8f3e8;
    color: #4a7c4a;
    border-radius: 20px;
    font-weight: 500;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    color: #1f3a1f;
    margin-bottom: 4px;
  }

  .en-name {
    font-size: 13px;
    color: #8a9a8a;
    font-style: italic;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }

  .nutrition {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    background: #f7faf7;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 22px;
  }

  .nutri-item {
    text-align: center;
  }

  .nutri-value {
    font-size: 18px;
    font-weight: 700;
    color: #3a6b3a;
  }

  .nutri-label {
    font-size: 11px;
    color: #7a8a7a;
    margin-top: 2px;
  }

  .desc {
    font-size: 14px;
    line-height: 1.7;
    color: #5a6b5a;
    margin-bottom: 22px;
    padding-left: 12px;
    border-left: 3px solid #9bc89b;
  }

  h2 {
    font-size: 15px;
    font-weight: 600;
    color: #2c4a2c;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 14px;
    background: #5a9e5a;
    border-radius: 2px;
  }

  .ingredients {
    list-style: none;
    margin-bottom: 22px;
  }

  .ingredients li {
    font-size: 14px;
    padding: 5px 0;
    color: #3d4d3d;
    border-bottom: 1px dashed #e8ede8;
  }

  .ingredients li:last-child { border-bottom: none; }

  .steps {
    list-style: none;
    counter-reset: step;
    margin-bottom: 22px;
  }

  .steps li {
    font-size: 14px;
    line-height: 1.7;
    padding: 8px 0 8px 32px;
    color: #3d4d3d;
    position: relative;
    counter-increment: step;
  }

  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 8px;
    width: 22px;
    height: 22px;
    background: #5a9e5a;
    color: #fff;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .meta {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: #7a8a7a;
    padding-top: 16px;
    border-top: 1px solid #e8ede8;
  }

  .meta span { display: flex; align-items: center; gap: 4px; }

  .btn {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #5a9e5a;
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 22px;
    box-shadow: 0 4px 16px rgba(90, 158, 90, 0.4);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn:hover {
    background: #4a8c4a;
    transform: rotate(180deg) scale(1.08);
  }

  .btn:active { transform: scale(0.95); }

  .btn:focus-visible {
    outline: 3px solid rgba(90, 158, 90, 0.4);
    outline-offset: 4px;
  }

  .notice {
    margin-top: 18px;
    font-size: 11px;
    line-height: 1.6;
    color: #7a8a7a;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 480px) {
    .card { padding: 24px 20px; }
    h1 { font-size: 24px; }
    .nutrition { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .btn { bottom: 20px; right: 20px; width: 50px; height: 50px; }
  }
</style>
</head>
<body>
  <main class="card" id="card" aria-live="polite">
    <div class="tags" id="tags"></div>
    <h1 id="name"></h1>
    <div class="en-name" id="enName"></div>
    <div class="nutrition">
      <div class="nutri-item"><div class="nutri-value" id="cal"></div><div class="nutri-label">千卡</div></div>
      <div class="nutri-item"><div class="nutri-value" id="protein"></div><div class="nutri-label">蛋白质</div></div>
      <div class="nutri-item"><div class="nutri-value" id="carbs"></div><div class="nutri-label">碳水</div></div>
      <div class="nutri-item"><div class="nutri-value" id="fat"></div><div class="nutri-label">脂肪</div></div>
    </div>
    <div class="desc" id="desc"></div>
    <h2>食材</h2>
    <ul class="ingredients" id="ingredients"></ul>
    <h2>步骤</h2>
    <ol class="steps" id="steps"></ol>
    <div class="meta">
      <span id="time"></span>
      <span id="difficulty"></span>
    </div>
    <p class="notice">营养数据为估算值，仅供日常饮食参考；有特殊营养或医疗需求时，请咨询专业人士。</p>
  </main>

  <button class="btn" id="randomBtn" type="button" title="换一道" aria-label="随机更换一道减脂菜谱">↻</button>

<script>
  const recipes = [
    {
      name: "鸡胸肉沙拉",
      enName: "Grilled Chicken Salad",
      tags: ["高蛋白", "低脂", "低碳水"],
      cal: 320, protein: "38g", carbs: "12g", fat: "12g",
      desc: "鲜嫩多汁的烤鸡胸搭配新鲜时蔬，蛋白质满满，饱腹感强，是减脂期的经典之选。",
      ingredients: ["鸡胸肉 150g", "生菜 100g", "小番茄 60g", "黄瓜 80g", "橄榄油 5ml", "黑胡椒、海盐少许"],
      steps: ["鸡胸肉用海盐和黑胡椒腌制15分钟", "平底锅少油煎至两面金黄，切片备用", "生菜撕小片，黄瓜切片，小番茄对半切开", "所有食材拌匀，淋少许橄榄油即可"],
      time: "⏱ 20分钟", difficulty: "⭐ 简单"
    },
    {
      name: "西兰花炒虾仁",
      enName: "Broccoli Shrimp Stir-fry",
      tags: ["高蛋白", "低脂", "快手"],
      cal: 240, protein: "28g", carbs: "10g", fat: "8g",
      desc: "虾仁低脂高蛋白，西兰花富含膳食纤维，清炒少油，鲜美又健康。",
      ingredients: ["虾仁 150g", "西兰花 200g", "蒜末少许", "生抽 5ml", "盐适量"],
      steps: ["西兰花掰小朵，沸水焯1分钟捞出", "虾仁用料酒和少许盐抓匀", "热锅少油爆香蒜末，下虾仁炒至变色", "加入西兰花翻炒，淋生抽调味出锅"],
      time: "⏱ 15分钟", difficulty: "⭐ 简单"
    },
    {
      name: "番茄龙利鱼",
      enName: "Tomato Basa Fish",
      tags: ["高蛋白", "低脂", "无刺"],
      cal: 260, protein: "30g", carbs: "14g", fat: "7g",
      desc: "龙利鱼肉质细嫩无刺，番茄酸甜开胃，几乎零脂肪，好吃不胖。",
      ingredients: ["龙利鱼柳 200g", "番茄 2个", "姜丝少许", "番茄酱 1勺", "盐适量"],
      steps: ["龙利鱼切块，用料酒和盐腌制10分钟", "番茄去皮切丁", "锅中少油，下姜丝和番茄丁炒出汁", "加番茄酱和半碗水煮开，下鱼片煮3分钟，调味出锅"],
      time: "⏱ 20分钟", difficulty: "⭐ 简单"
    },
    {
      name: "燕麦虾仁粥",
      enName: "Oat Shrimp Porridge",
      tags: ["高蛋白", "饱腹", "暖胃"],
      cal: 280, protein: "22g", carbs: "38g", fat: "5g",
      desc: "燕麦代替白米做粥，升糖指数更低，搭配虾仁增加蛋白质，暖身又扛饿。",
      ingredients: ["即食燕麦 40g", "虾仁 80g", "鸡蛋 1个", "葱花少许", "盐、白胡椒适量"],
      steps: ["燕麦加清水煮至浓稠", "虾仁下锅煮熟，打入蛋花", "加盐和白胡椒调味", "撒葱花即可"],
      time: "⏱ 12分钟", difficulty: "⭐ 简单"
    },
    {
      name: "香煎三文鱼配芦笋",
      enName: "Pan-seared Salmon with Asparagus",
      tags: ["优质脂肪", "高蛋白", "Omega-3"],
      cal: 380, protein: "32g", carbs: "8g", fat: "24g",
      desc: "三文鱼富含优质脂肪和Omega-3，搭配芦笋清爽解腻，营养均衡。",
      ingredients: ["三文鱼 150g", "芦笋 150g", "柠檬半个", "海盐、黑胡椒适量", "橄榄油 5ml"],
      steps: ["三文鱼用海盐和黑胡椒腌制10分钟", "热锅少油，三文鱼皮朝下煎3分钟，翻面再煎2分钟", "芦笋焯水后用橄榄油快炒，撒盐", "装盘，挤柠檬汁提香"],
      time: "⏱ 18分钟", difficulty: "⭐⭐ 中等"
    },
    {
      name: "凉拌豆腐菠菜",
      enName: "Tofu Spinach Salad",
      tags: ["素食", "高蛋白", "低卡"],
      cal: 180, protein: "16g", carbs: "10g", fat: "8g",
      desc: "豆腐提供植物蛋白，菠菜补充铁和纤维，凉拌做法清爽低脂，适合做轻食晚餐。",
      ingredients: ["嫩豆腐 200g", "菠菜 150g", "蒜末少许", "生抽 8ml", "香醋 5ml", "香油 3ml"],
      steps: ["菠菜焯水30秒，过凉水挤干切段", "豆腐切块，和菠菜一起装盘", "蒜末、生抽、香醋、香油调成酱汁", "淋在豆腐菠菜上拌匀即可"],
      time: "⏱ 10分钟", difficulty: "⭐ 简单"
    },
    {
      name: "鸡胸肉荞麦面",
      enName: "Chicken Soba Noodles",
      tags: ["高蛋白", "低GI", "饱腹"],
      cal: 350, protein: "34g", carbs: "42g", fat: "6g",
      desc: "荞麦面升糖指数低，搭配高蛋白鸡胸肉，饱腹感强，适合减脂期主食。",
      ingredients: ["荞麦面 60g", "鸡胸肉 120g", "黄瓜 80g", "胡萝卜 50g", "生抽 10ml", "醋 5ml"],
      steps: ["荞麦面煮熟过凉水，沥干", "鸡胸肉煮熟撕成丝", "黄瓜、胡萝卜切丝", "所有食材拌匀，淋生抽和醋调味"],
      time: "⏱ 15分钟", difficulty: "⭐ 简单"
    },
    {
      name: "秋葵炒蛋",
      enName: "Okra with Scrambled Egg",
      tags: ["高蛋白", "高纤维", "快手"],
      cal: 220, protein: "14g", carbs: "12g", fat: "12g",
      desc: "秋葵富含黏液蛋白和膳食纤维，鸡蛋补充蛋白质，少油快炒，简单又营养。",
      ingredients: ["秋葵 150g", "鸡蛋 2个", "蒜末少许", "盐适量", "橄榄油 5ml"],
      steps: ["秋葵去蒂切小段，焯水1分钟", "鸡蛋打散加少许盐", "热锅少油，倒入蛋液炒至凝固盛出", "另起锅爆香蒜末，下秋葵翻炒，倒回鸡蛋炒匀出锅"],
      time: "⏱ 12分钟", difficulty: "⭐ 简单"
    },
    {
      name: "牛肉西兰花饭",
      enName: "Beef Broccoli Bowl",
      tags: ["高蛋白", "补铁", "饱腹"],
      cal: 360, protein: "30g", carbs: "35g", fat: "10g",
      desc: "瘦牛肉补铁补蛋白，西兰花高纤维，搭配糙米饭，营养均衡扛饿。",
      ingredients: ["瘦牛肉 120g", "西兰花 150g", "糙米饭 100g", "生抽 8ml", "蚝油 5ml", "蒜末少许"],
      steps: ["牛肉切薄片，用生抽、料酒、淀粉腌制10分钟", "西兰花焯水备用", "热锅少油爆香蒜末，下牛肉炒至变色", "加西兰花和蚝油翻炒，浇在糙米饭上"],
      time: "⏱ 20分钟", difficulty: "⭐⭐ 中等"
    },
    {
      name: "黄瓜鸡蛋汤",
      enName: "Cucumber Egg Soup",
      tags: ["超低卡", "清淡", "晚餐"],
      cal: 90, protein: "8g", carbs: "6g", fat: "4g",
      desc: "几乎零负担的清汤，黄瓜清爽、鸡蛋增香，适合减脂期晚餐或加餐。",
      ingredients: ["黄瓜 1根", "鸡蛋 1个", "葱花少许", "盐、香油适量"],
      steps: ["黄瓜切薄片", "锅中烧水，水开后下黄瓜片煮2分钟", "淋入蛋液形成蛋花", "加盐、香油，撒葱花出锅"],
      time: "⏱ 8分钟", difficulty: "⭐ 简单"
    }
  ];

  const card = document.getElementById('card');
  const btn = document.getElementById('randomBtn');
  let previousIndex = -1;

  function renderRecipe() {
    let nextIndex;
    do {
      nextIndex = Math.floor(Math.random() * recipes.length);
    } while (recipes.length > 1 && nextIndex === previousIndex);
    previousIndex = nextIndex;
    const r = recipes[nextIndex];
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = 'fadeIn 0.5s ease';

    document.getElementById('name').textContent = r.name;
    document.getElementById('enName').textContent = r.enName;
    document.getElementById('cal').textContent = r.cal;
    document.getElementById('protein').textContent = r.protein;
    document.getElementById('carbs').textContent = r.carbs;
    document.getElementById('fat').textContent = r.fat;
    document.getElementById('desc').textContent = r.desc;
    document.getElementById('time').textContent = r.time;
    document.getElementById('difficulty').textContent = r.difficulty;

    const tagsEl = document.getElementById('tags');
    tagsEl.innerHTML = r.tags.map(t => `<span class="tag">${t}</span>`).join('');

    const ingEl = document.getElementById('ingredients');
    ingEl.innerHTML = r.ingredients.map(i => `<li>${i}</li>`).join('');

    const stepsEl = document.getElementById('steps');
    stepsEl.innerHTML = r.steps.map(s => `<li>${s}</li>`).join('');
  }

  btn.addEventListener('click', renderRecipe);
  renderRecipe();
</script>
</body>
</html>
