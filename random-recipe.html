<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日菜谱 · Random Recipe</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7;
    --paper:#fbf7ee;
    --ink:#2b2622;
    --muted:#8a7d6b;
    --accent:#b8492b;
    --line:#e3dac8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter','Noto Serif SC',serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(184,73,43,0.04) 0, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(138,125,107,0.05) 0, transparent 40%);
  }
  .wrap{
    width:100%;
    max-width:560px;
    background:var(--paper);
    border-radius:24px;
    padding:56px 48px 44px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 20px 60px -20px rgba(43,38,34,0.15),
      0 2px 8px rgba(43,38,34,0.04);
    position:relative;
    overflow:hidden;
  }
  .wrap::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.17 0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 0.04 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity:0.6;
    pointer-events:none;
    mix-blend-mode:multiply;
  }
  .content{position:relative;z-index:1}
  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px rgba(184,73,43,0.12);
  }
  .eyebrow .line{flex:1;height:1px;background:var(--line)}
  h1.name{
    font-family:'Playfair Display','Noto Serif SC',serif;
    font-weight:700;
    font-size:38px;
    line-height:1.15;
    letter-spacing:-0.01em;
    margin-bottom:10px;
  }
  .en{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:400;
    font-size:15px;
    color:var(--muted);
    margin-bottom:22px;
  }
  .desc{
    font-size:14.5px;
    line-height:1.75;
    color:#5b5247;
    margin-bottom:28px;
    padding-bottom:24px;
    border-bottom:1px dashed var(--line);
  }
  .section-title{
    font-size:11px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::before{
    content:"";width:14px;height:1px;background:var(--muted);
  }
  ul.ingredients{
    list-style:none;
    margin-bottom:28px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 18px;
  }
  ul.ingredients li{
    font-size:13.5px;
    color:#3d3730;
    position:relative;
    padding-left:14px;
  }
  ul.ingredients li::before{
    content:"";
    position:absolute;
    left:0;top:9px;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--accent);
    opacity:0.7;
  }
  ol.steps{
    list-style:none;
    counter-reset:step;
    margin-bottom:36px;
  }
  ol.steps li{
    counter-increment:step;
    font-size:14px;
    line-height:1.7;
    color:#3d3730;
    padding-left:32px;
    position:relative;
    margin-bottom:14px;
  }
  ol.steps li::before{
    content:counter(step,decimal-leading-zero);
    position:absolute;
    left:0;top:0;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:15px;
    color:var(--accent);
    width:24px;
  }
  .footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  .meta{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .meta b{color:var(--ink);font-weight:500}
  button.roll{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.08em;
    color:var(--paper);
    background:var(--ink);
    padding:14px 26px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
    box-shadow:0 6px 16px -6px rgba(43,38,34,0.5);
  }
  button.roll:hover{
    transform:translateY(-2px);
    background:var(--accent);
    box-shadow:0 10px 24px -8px rgba(184,73,43,0.55);
  }
  button.roll:active{transform:translateY(0)}
  button.roll svg{
    width:14px;height:14px;
    transition:transform .6s cubic-bezier(.4,.2,.2,1);
  }
  button.roll:hover svg{transform:rotate(180deg)}
  .fade{
    animation:fade .55s ease both;
  }
  @keyframes fade{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
  .tag{
    display:inline-block;
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid rgba(184,73,43,0.3);
    padding:4px 10px;
    border-radius:999px;
    margin-right:6px;
    margin-bottom:8px;
  }
  @media (max-width:520px){
    .wrap{padding:40px 28px 32px}
    h1.name{font-size:30px}
    ul.ingredients{grid-template-columns:1fr}
    .footer{flex-direction:column;align-items:stretch}
    button.roll{justify-content:center}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="content" id="card">
      <div class="eyebrow">
        <span class="dot"></span>
        <span>Today's Recipe</span>
        <span class="line"></span>
        <span id="index">01 / 08</span>
      </div>
      <div id="tags"></div>
      <h1 class="name" id="name">番茄炒蛋</h1>
      <div class="en" id="en">Stir-fried Tomato & Egg</div>
      <p class="desc" id="desc">最朴素的家常菜，却最考验火候。</p>

      <div class="section-title">Ingredients · 食材</div>
      <ul class="ingredients" id="ingredients"></ul>

      <div class="section-title">Steps · 做法</div>
      <ol class="steps" id="steps"></ol>

      <div class="footer">
        <div class="meta">
          <b id="time">15 min</b> · <span id="level">Easy</span>
        </div>
        <button class="roll" id="rollBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9"/>
            <path d="M3 4v5h5"/>
          </svg>
          换一道
        </button>
      </div>
    </div>
  </main>

<script>
const recipes = [
  {
    name:"番茄炒蛋",
    en:"Stir-fried Tomato & Egg",
    tags:["家常","快手","素菜"],
    desc:"最朴素的家常菜，酸甜适口，却最考验火候与时机。",
    ingredients:["番茄 2 个","鸡蛋 3 个","盐 适量","糖 一小勺","葱花 少许"],
    steps:["鸡蛋打散加少许盐","热油锅倒入蛋液划散盛出","底油下番茄炒出汁","加糖、盐调味","倒回鸡蛋翻炒，撒葱花出锅"],
    time:"15 min", level:"Easy"
  },
  {
    name:"葱油拌面",
    en:"Scallion Oil Noodles",
    tags:["沪式","面食","十分钟"],
    desc:"一缕葱香，半碗清面，是深夜里最熨帖的安慰。",
    ingredients:["细面条 1 把","小葱 1 把","生抽 2 勺","老抽 1 勺","白糖 1 小勺","油 适量"],
    steps:["小葱切长段","油温五成热下葱段慢炸","炸至焦黄捞出","生抽老抽糖调匀","面煮熟拌酱淋葱油即成"],
    time:"10 min", level:"Easy"
  },
  {
    name:"蒜蓉西兰花",
    en:"Garlic Broccoli",
    tags:["清淡","健康","素菜"],
    desc:"翠绿与蒜香相得益彰，清简之中亦有滋味。",
    ingredients:["西兰花 1 朵","蒜 4 瓣","盐 适量","油 少许"],
    steps:["西兰花掰小朵焯水","蒜切末","热油爆香蒜末","下西兰花快炒","加盐出锅"],
    time:"8 min", level:"Easy"
  },
  {
    name:"土豆炖牛肉",
    en:"Beef & Potato Stew",
    tags:["炖菜","硬菜","暖身"],
    desc:"小火慢炖，肉酥薯糯，是冬日灶台前的等待。",
    ingredients:["牛腩 500g","土豆 2 个","胡萝卜 1 根","姜 几片","八角 1 颗","生抽 老抽 各一勺"],
    steps:["牛腩切块焯水","姜八角爆香","下牛肉煸炒上色","加水没过肉，炖 1 小时","放土豆胡萝卜再炖 20 分钟","收汁出锅"],
    time:"90 min", level:"Medium"
  },
  {
    name:"日式厚蛋烧",
    en:"Tamagoyaki",
    tags:["日式","早餐","蛋类"],
    desc:"层层卷起，嫩黄如绸，是清晨里的小确幸。",
    ingredients:["鸡蛋 4 个","味淋 1 勺","糖 1 小勺","盐 一点","油 少许"],
    steps:["蛋液加味淋糖盐打匀","方锅刷油薄薄一层","倒一层蛋液半凝固卷起","再倒一层卷起","重复至蛋液用完","切段装盘"],
    time:"15 min", level:"Medium"
  },
  {
    name:"酸辣土豆丝",
    en:"Hot & Sour Shredded Potato",
    tags:["川味","下饭","快手"],
    desc:"脆生酸辣，一盘下饭，最是爽利。",
    ingredients:["土豆 2 个","干辣椒 几个","花椒 一小撮","醋 2 勺","盐 适量"],
    steps:["土豆切细丝泡水去淀粉","热油下花椒辣椒","下土豆丝大火快炒","沿锅边淋醋","加盐翻匀出锅"],
    time:"10 min", level:"Easy"
  },
  {
    name:"奶油蘑菇意面",
    en:"Creamy Mushroom Pasta",
    tags:["西餐","意面","浓郁"],
    desc:"菌香裹着奶香，缠绕每一根面条，是周夜晚餐的仪式感。",
    ingredients:["意面 1 把","口蘑 6 朵","蒜 2 瓣","淡奶油 100ml","黑胡椒 适量","帕玛森奶酪 少许"],
    steps:["意面煮 8 分钟捞出","蒜切末蘑菇切片","黄油爆香蒜末","下蘑菇煸香","倒奶油小火煮稠","拌入意面撒胡椒奶酪"],
    time:"20 min", level:"Easy"
  },
  {
    name:"蜂蜜柠檬鸡",
    en:"Honey Lemon Chicken",
    tags:["甜咸","煎鸡","派对"],
    desc:"焦糖色的鸡皮裹着柠檬清香，甜咸在舌尖跳跃。",
    ingredients:["鸡腿 2 块","蜂蜜 1 勺","柠檬 半个","生抽 1 勺","黑胡椒 适量","蒜 2 瓣"],
    steps:["鸡腿划刀腌制 15 分钟","皮朝下煎至金黄","翻面煎熟","蜂蜜生抽柠檬汁调汁","倒入锅中收稠","撒黑胡椒出锅"],
    time:"25 min", level:"Medium"
  }
];

const $ = id => document.getElementById(id);
let current = -1;

function render(i){
  const r = recipes[i];
  $('name').textContent = r.name;
  $('en').textContent = r.en;
  $('desc').textContent = r.desc;
  $('time').textContent = r.time;
  $('level').textContent = r.level;
  $('index').textContent = String(i+1).padStart(2,'0') + ' / ' + String(recipes.length).padStart(2,'0');

  $('tags').innerHTML = r.tags.map(t=>`<span class="tag">${t}</span>`).join('');

  $('ingredients').innerHTML = r.ingredients.map(i=>`<li>${i}</li>`).join('');
  $('steps').innerHTML = r.steps.map(s=>`<li>${s}</li>`).join('');

  const c = document.getElementById('card');
  c.classList.remove('fade');
  void c.offsetWidth;
  c.classList.add('fade');
}

function roll(){
  let i;
  do { i = Math.floor(Math.random()*recipes.length); } while(i===current && recipes.length>1);
  current = i;
  render(i);
}

$('rollBtn').addEventListener('click', roll);
roll();
</script>
</body>
</html>
