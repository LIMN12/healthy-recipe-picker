<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeSplit · 一日时间三分法</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue-1: #1e6bff;
      --blue-2: #4a90ff;
      --blue-soft: #e8f1ff;
      --blue-bg: #f5f9ff;
      --ink: #1a2b4a;
      --ink-soft: #6b7d99;
      --line: #e3ecf7;
      --card: #ffffff;

      --class-color: #2563eb;
      --class-soft: #dbeafe;
      --study-color: #0ea5e9;
      --study-soft: #e0f2fe;
      --leisure-color: #6366f1;
      --leisure-soft: #e0e7ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #e8f1ff 0%, #ffffff 50%, #f5f9ff 100%);
      min-height: 100vh;
      padding: 40px 16px;
      color: var(--ink);
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(30,107,255,0.12);
      overflow: hidden;
      border: 1px solid var(--line);
    }

    /* Header */
    header {
      position: relative;
      background: linear-gradient(135deg, #1e6bff 0%, #4a90ff 100%);
      color: #fff;
      padding: 36px 28px 30px;
      overflow: hidden;
    }
    header::before {
      content: "";
      position: absolute;
      top: -50px; right: -50px;
      width: 180px; height: 180px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
    header::after {
      content: "";
      position: absolute;
      bottom: -60px; left: 20%;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 6px;
      position: relative;
    }
    .slogan {
      font-size: 14px;
      opacity: 0.95;
      margin-bottom: 14px;
      position: relative;
    }
    .date-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      backdrop-filter: blur(4px);
      position: relative;
    }

    /* Input area */
    .input-section {
      padding: 28px 28px 8px;
    }
    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
    }
    .field input {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      font-family: inherit;
    }
    .field input:focus {
      border-color: var(--blue-1);
      box-shadow: 0 0 0 3px rgba(30,107,255,0.12);
    }
    .field input.w-name { width: 160px; }
    .field input.w-time { width: 110px; }
    .field input.w-num  { width: 90px; }
    .field input.w-small{ width: 120px; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: transform .15s, box-shadow .2s, opacity .2s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #1e6bff, #4a90ff);
      color: #fff;
      box-shadow: 0 6px 16px rgba(30,107,255,0.28);
    }
    .btn-primary:hover { box-shadow: 0 8px 22px rgba(30,107,255,0.35); }
    .btn-ghost {
      background: var(--blue-soft);
      color: var(--blue-1);
    }
    .btn-ghost:hover { background: #d4e4ff; }
    .btn-danger {
      background: transparent;
      color: #ef4444;
      padding: 6px 10px;
      font-size: 13px;
    }
    .btn-danger:hover { background: #fef2f2; }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin: 22px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--blue-1);
    }

    /* List items */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--blue-bg);
      border-radius: 10px;
      font-size: 14px;
    }
    .item .name { flex: 1; font-weight: 500; }
    .item .meta { color: var(--ink-soft); font-size: 13px; }
    .item .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .item.empty {
      justify-content: center;
      color: var(--ink-soft);
      font-size: 13px;
      background: transparent;
      border: 1px dashed var(--line);
    }

    /* Calculate bar */
    .calc-bar {
      margin: 24px 28px;
      padding: 16px 20px;
      background: var(--blue-bg);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .calc-bar .tip {
      font-size: 13px;
      color: var(--ink-soft);
    }
    .calc-bar .tip b { color: var(--ink); }

    /* Result: 3 sections */
    .result-section {
      padding: 8px 28px 28px;
    }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 18px;
    }
    .result-card {
      border-radius: 18px;
      padding: 18px 16px;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }
    .result-card.class   { background: linear-gradient(135deg, #2563eb, #3b82f6); }
    .result-card.study   { background: linear-gradient(135deg, #0ea5e9, #38bdf8); }
    .result-card.leisure { background: linear-gradient(135deg, #6366f1, #818cf8); }
    .result-card .icon {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .result-card .label {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .result-card .hours {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .result-card .hours small {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.85;
      margin-left: 2px;
    }
    .result-card .percent {
      margin-top: 6px;
      font-size: 12px;
      opacity: 0.85;
    }
    .result-card::after {
      content: "";
      position: absolute;
      top: -30px; right: -30px;
      width: 90px; height: 90px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
    }

    /* Proportion bar */
    .prop-bar {
      height: 14px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      background: var(--blue-bg);
      margin-bottom: 10px;
    }
    .prop-bar .seg {
      height: 100%;
      transition: width .5s ease;
    }
    .prop-bar .seg.class   { background: var(--class-color); }
    .prop-bar .seg.study   { background: var(--study-color); }
    .prop-bar .seg.leisure { background: var(--leisure-color); }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--ink-soft);
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend i {
      width: 10px; height: 10px;
      border-radius: 3px;
      display: inline-block;
    }

    /* Goal planning */
    .goal-box {
      background: var(--blue-bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 8px;
    }
    .plan-preview {
      margin-top: 12px;
      padding: 12px 14px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink);
      line-height: 1.7;
      display: none;
    }
    .plan-preview.show { display: block; }
    .plan-preview .summary {
      font-weight: 600;
      color: var(--blue-1);
      margin-bottom: 6px;
    }
    .plan-preview ul {
      list-style: none;
      padding: 0;
    }
    .plan-preview li {
      padding: 3px 0;
      color: var(--ink-soft);
      font-size: 12.5px;
    }
    .plan-preview li::before {
      content: "▸ ";
      color: var(--study-color);
    }

    @media (max-width: 600px) {
      .result-grid { grid-template-columns: 1fr; }
      .field input.w-name { width: 140px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">TIME SPLIT</div>
      <div class="slogan">课业 · 自学 · 休闲，一日三分，张弛有度</div>
      <div class="date-bar" id="dateBar">📅 加载中…</div>
    </header>

    <!-- Input: sleep -->
    <div class="input-section">
      <div class="input-row">
        <div class="field">
          <label>每日睡眠时长（小时）</label>
          <input type="number" id="sleepHours" value="8" min="4" max="14" step="0.5" class="w-small">
        </div>
        <div class="field" style="flex:1;">
          <label>&nbsp;</label>
          <div class="tip" style="font-size:13px;color:var(--ink-soft);">
            清醒时长 = 24 − 睡眠。剩余时间将在三个板块间分配。
          </div>
        </div>
      </div>

      <!-- Classes -->
      <div class="section-title"><span class="dot"></span>课业输入</div>
      <div class="input-row">
        <div class="field">
          <label>课程名</label>
          <input type="text" id="className" placeholder="如：高数" class="w-name">
        </div>
        <div class="field">
          <label>开始时间</label>
          <input type="time" id="classStart" class="w-time">
        </div>
        <div class="field">
          <label>结束时间</label>
          <input type="time" id="classEnd" class="w-time">
        </div>
        <button class="btn btn-primary" onclick="addClass()">+ 添加课程</button>
      </div>
      <div class="item-list" id="classList">
        <div class="item empty">暂无课程，添加一节试试</div>
      </div>

      <!-- Self-study tasks -->
      <div class="section-title"><span class="dot" style="background:var(--study-color)"></span>自主学习输入</div>
      <div class="input-row">
        <div class="field">
          <label>任务名</label>
          <input type="text" id="taskName" placeholder="如：复习英语" class="w-name">
        </div>
        <div class="field">
          <label>预计时长（小时）</label>
          <input type="number" id="taskHours" placeholder="1.5" min="0.25" step="0.25" class="w-num">
        </div>
        <button class="btn btn-primary" onclick="addTask()">+ 添加任务</button>
      </div>
      <div class="item-list" id="taskList">
        <div class="item empty">暂无自学任务</div>
      </div>

      <!-- Goal planning -->
      <div class="section-title"><span class="dot" style="background:var(--leisure-color)"></span>目标规划 · 自动生成任务</div>
      <div class="goal-box">
        <div class="input-row">
          <div class="field" style="flex:1; min-width:200px;">
            <label>我的现状</label>
            <input type="text" id="currentStatus" placeholder="如：四级380分，词汇薄弱">
          </div>
          <div class="field" style="flex:1; min-width:200px;">
            <label>想达成的目标</label>
            <input type="text" id="goalTarget" placeholder="如：3个月内四级考到500分">
          </div>
        </div>
        <div class="input-row">
          <div class="field">
            <label>截止日期</label>
            <input type="date" id="deadline" class="w-small">
          </div>
          <div class="field">
            <label>每天可投入（小时）</label>
            <input type="number" id="dailyHours" value="2" min="0.5" step="0.5" class="w-num">
          </div>
          <button class="btn btn-primary" onclick="generatePlan()">🎯 生成并添加任务</button>
        </div>
        <div class="plan-preview" id="planPreview"></div>
      </div>
    </div>

    <!-- Calculate -->
    <div class="calc-bar">
      <div class="tip">填好课程与自学任务后，点击右侧按钮<b> 生成时间三分方案</b></div>
      <button class="btn btn-primary" onclick="calculate()">⚡ 生成方案</button>
    </div>

    <!-- Result -->
    <div class="result-section">
      <div class="result-grid" id="resultGrid">
        <div class="result-card class">
          <div class="icon">📚</div>
          <div class="label">课业时间</div>
          <div class="hours">0<small>h</small></div>
          <div class="percent">占清醒时间 0%</div>
        </div>
        <div class="result-card study">
          <div class="icon">✏️</div>
          <div class="label">自主学习时间</div>
          <div class="hours">0<small>h</small></div>
          <div class="percent">占清醒时间 0%</div>
        </div>
        <div class="result-card leisure">
          <div class="icon">🎮</div>
          <div class="label">休闲时间</div>
          <div class="hours">0<small>h</small></div>
          <div class="percent">占清醒时间 0%</div>
        </div>
      </div>

      <div class="prop-bar" id="propBar">
        <div class="seg class" style="width:0%"></div>
        <div class="seg study" style="width:0%"></div>
        <div class="seg leisure" style="width:0%"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--class-color)"></i>课业</span>
        <span><i style="background:var(--study-color)"></i>自主学习</span>
        <span><i style="background:var(--leisure-color)"></i>休闲</span>
      </div>
    </div>
  </div>

  <script>
    // ---------- State ----------
    const state = {
      classes: [],  // {id, name, start, end, hours}
      tasks: []     // {id, name, hours}
    };

    // ---------- Date ----------
    (function setDate() {
      const d = new Date();
      const wk = ['日','一','二','三','四','五','六'];
      const txt = `📅 ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${wk[d.getDay()]}`;
      document.getElementById('dateBar').textContent = txt;

      // 默认截止日期 = 30 天后
      const dl = new Date(d);
      dl.setDate(dl.getDate() + 30);
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('deadline').value = `${dl.getFullYear()}-${pad(dl.getMonth()+1)}-${pad(dl.getDate())}`;
    })();

    // ---------- Helpers ----------
    const uid = () => Math.random().toString(36).slice(2, 9);

    function timeToHours(t) {
      const [h, m] = t.split(':').map(Number);
      return h + m / 60;
    }

    function fmt(n) {
      return (Math.round(n * 100) / 100).toString();
    }

    // ---------- Classes ----------
    function addClass() {
      const name = document.getElementById('className').value.trim();
      const start = document.getElementById('classStart').value;
      const end = document.getElementById('classEnd').value;
      if (!name) { alert('请输入课程名'); return; }
      if (!start || !end) { alert('请选择课程起止时间'); return; }
      let dur = timeToHours(end) - timeToHours(start);
      if (dur <= 0) { alert('结束时间需晚于开始时间'); return; }
      dur = Math.round(dur * 100) / 100;
      state.classes.push({ id: uid(), name, start, end, hours: dur });
      document.getElementById('className').value = '';
      document.getElementById('classStart').value = '';
      document.getElementById('classEnd').value = '';
      renderClasses();
    }

    function removeClass(id) {
      state.classes = state.classes.filter(c => c.id !== id);
      renderClasses();
    }

    function renderClasses() {
      const box = document.getElementById('classList');
      if (state.classes.length === 0) {
        box.innerHTML = '<div class="item empty">暂无课程，添加一节试试</div>';
        return;
      }
      box.innerHTML = state.classes.map(c => `
        <div class="item">
          <span class="tag" style="background:var(--class-soft);color:var(--class-color)">课业</span>
          <span class="name">${c.name}</span>
          <span class="meta">${c.start} – ${c.end} · ${fmt(c.hours)}h</span>
          <button class="btn btn-danger" onclick="removeClass('${c.id}')">删除</button>
        </div>
      `).join('');
    }

    // ---------- Tasks ----------
    function addTask() {
      const name = document.getElementById('taskName').value.trim();
      const hours = parseFloat(document.getElementById('taskHours').value);
      if (!name) { alert('请输入任务名'); return; }
      if (!hours || hours <= 0) { alert('请输入有效的时长'); return; }
      state.tasks.push({ id: uid(), name, hours });
      document.getElementById('taskName').value = '';
      document.getElementById('taskHours').value = '';
      renderTasks();
    }

    function removeTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      renderTasks();
    }

    function renderTasks() {
      const box = document.getElementById('taskList');
      if (state.tasks.length === 0) {
        box.innerHTML = '<div class="item empty">暂无自学任务</div>';
        return;
      }
      box.innerHTML = state.tasks.map(t => `
        <div class="item">
          <span class="tag" style="background:var(--study-soft);color:var(--study-color)">自学</span>
          <span class="name">${t.name}</span>
          <span class="meta">${fmt(t.hours)}h</span>
          <button class="btn btn-danger" onclick="removeTask('${t.id}')">删除</button>
        </div>
      `).join('');
    }

    // ---------- Goal planning: auto-generate tasks ----------
    function generatePlan() {
      const status = document.getElementById('currentStatus').value.trim();
      const goal = document.getElementById('goalTarget').value.trim();
      const deadline = document.getElementById('deadline').value;
      const daily = parseFloat(document.getElementById('dailyHours').value) || 2;

      if (!goal) { alert('请输入想达成的目标'); return; }
      if (!deadline) { alert('请选择截止日期'); return; }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dl = new Date(deadline);
      const days = Math.ceil((dl - today) / (1000 * 60 * 60 * 24));
      if (days <= 0) { alert('截止日期需晚于今天'); return; }

      const totalHours = Math.round(days * daily * 100) / 100;

      // 根据可用天数拆分阶段
      let phases;
      if (days <= 7) {
        phases = [
          { name: '快速梳理', ratio: 0.5, tasks: [`${goal}·核心知识点速览`, `${goal}·薄弱项集中突破`] },
          { name: '冲刺模考', ratio: 0.5, tasks: [`${goal}·模拟测试与错题复盘`] }
        ];
      } else if (days <= 30) {
        phases = [
          { name: '基础巩固', ratio: 0.35, tasks: [`${goal}·基础知识系统梳理`, `${goal}·核心考点笔记整理`] },
          { name: '强化训练', ratio: 0.40, tasks: [`${goal}·专项练习`, `${goal}·错题集归纳`] },
          { name: '冲刺模考', ratio: 0.25, tasks: [`${goal}·全真模拟测试`, `${goal}·考前查漏补缺`] }
        ];
      } else {
        phases = [
          { name: '基础巩固', ratio: 0.30, tasks: [`${goal}·基础知识系统学习`, `${goal}·核心概念笔记`] },
          { name: '强化训练', ratio: 0.30, tasks: [`${goal}·专项突破练习`, `${goal}·薄弱项攻坚`] },
          { name: '真题/实战', ratio: 0.25, tasks: [`${goal}·真题/项目实战`, `${goal}·错题深度复盘`] },
          { name: '冲刺模考', ratio: 0.15, tasks: [`${goal}·全真模拟`, `${goal}·考前回顾`] }
        ];
      }

      // 按比例分配时长，生成任务并加入自学列表
      const newTasks = [];
      phases.forEach(p => {
        const phaseHours = totalHours * p.ratio;
        const perTask = Math.max(0.25, Math.round((phaseHours / p.tasks.length) * 4) / 4);
        p.tasks.forEach(t => {
          newTasks.push({ id: uid(), name: `[${p.name}] ${t}`, hours: perTask });
        });
      });

      state.tasks.push(...newTasks);
      renderTasks();

      // 预览面板
      const preview = document.getElementById('planPreview');
      preview.classList.add('show');
      preview.innerHTML = `
        <div class="summary">✅ 已生成 ${newTasks.length} 个任务 · 共 ${fmt(totalHours)}h（${days}天 × ${daily}h/天），已加入自学列表</div>
        ${status ? `<div style="color:var(--ink-soft);font-size:12.5px;">现状：${status}</div>` : ''}
        <ul>${newTasks.map(t => `<li>${t.name} · ${fmt(t.hours)}h</li>`).join('')}</ul>
      `;

      // 自动滚动到预览
      preview.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ---------- Calculate ----------
    function calculate() {
      const sleep = parseFloat(document.getElementById('sleepHours').value) || 8;
      const wake = 24 - sleep;
      const classHours = state.classes.reduce((s, c) => s + c.hours, 0);
      const studyHours = state.tasks.reduce((s, t) => s + t.hours, 0);
      const leisureHours = Math.max(0, wake - classHours - studyHours);

      const cards = document.querySelectorAll('.result-card');
      const data = [
        { hours: classHours,   color: 'var(--class-color)' },
        { hours: studyHours,   color: 'var(--study-color)' },
        { hours: leisureHours, color: 'var(--leisure-color)' }
      ];

      data.forEach((d, i) => {
        const card = cards[i];
        const h = card.querySelector('.hours');
        const p = card.querySelector('.percent');
        h.innerHTML = `${fmt(d.hours)}<small>h</small>`;
        const pct = wake > 0 ? Math.round((d.hours / wake) * 100) : 0;
        p.textContent = `占清醒时间 ${pct}%`;
      });

      // Proportion bar
      const segs = document.querySelectorAll('#propBar .seg');
      const total = classHours + studyHours + leisureHours;
      segs[0].style.width = total > 0 ? (classHours / total * 100) + '%' : '0%';
      segs[1].style.width = total > 0 ? (studyHours / total * 100) + '%' : '0%';
      segs[2].style.width = total > 0 ? (leisureHours / total * 100) + '%' : '0%';

      // Warn if over-committed
      if (classHours + studyHours > wake) {
        alert(`⚠️ 课业+自学已超过清醒时长（${fmt(wake)}h），休闲时间被挤为 0。建议减少任务或延长清醒时间。`);
      }
    }
  </script>
</body>
</html>
